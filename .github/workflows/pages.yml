# Publishes every tool's docs/ folder to GitHub Pages at /<tool>/,
# plus the landing page in .github/pages/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "*/docs/**"
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r .github/pages/. _site/
          for d in */docs; do
            tool="${d%/docs}"
            mkdir -p "_site/$tool"
            cp -r "$d/." "_site/$tool/"
          done
          touch _site/.nojekyll
          find _site -type f
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
